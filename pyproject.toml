[project]
name = "lreader-engine"
version = "0.1.0"
description = "Local-first multilingual OCR and translation engine"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116",
  "pydantic>=2.11",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lreader_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
