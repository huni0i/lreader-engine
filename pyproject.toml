[project]
name = "lreader-engine"
version = "0.1.0"
description = "Local-first multilingual OCR and translation engine"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.10",
  "easyocr>=1.7.2",
  "mlx-lm>=0.31",
  "pillow>=11.3",
  "simple-lama-inpainting-updated",
  "torch>=2.11",
  "torchvision>=0.26",
  "transformers>=5.6",
]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lreader_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
