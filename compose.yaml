services:
  engine:
    build:
      context: .
    image: lreader-engine:cuda
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      HF_HOME: /models/huggingface
      LREADER_TRANSLATION_MODEL: tencent/Hy-MT2-7B
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ./data/huggingface:/models/huggingface
      - ./data/easyocr:/app/.cache/easyocr
    ports:
      - "${LREADER_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m
